name: OpenEMS V2 integer headroom diagnostic (unmodified upstream)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout research
        uses: actions/checkout@v4
        with:
          path: research
      - name: Checkout pinned upstream (unmodified)
        uses: actions/checkout@v4
        with:
          repository: OpenEMS/openems
          ref: 9a4b30331ac1f557d752eb8290633042144550a7
          path: openems
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install diagnostic JUnit only
        run: cp research/tests/candidate/HeadroomIntermediateOverflowTest.java openems/io.openems.edge.ess.core/test/io/openems/edge/ess/core/power/v2/
      - name: Execute upstream baseline diagnostic
        working-directory: openems
        run: |
          chmod +x gradlew
          ./gradlew :io.openems.edge.ess.core:test --tests '*HeadroomIntermediateOverflowTest' --no-daemon
      - name: Upload JUnit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unmodified-upstream-headroom-diagnostic
          path: |
            openems/io.openems.edge.ess.core/build/test-results/**
            openems/io.openems.edge.ess.core/build/reports/tests/**
          if-no-files-found: ignore
