name: OpenEMS V2 direction-aware candidate validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout research
        uses: actions/checkout@v4
        with:
          path: research
      - name: Checkout pinned OpenEMS baseline
        uses: actions/checkout@v4
        with:
          repository: OpenEMS/openems
          ref: 9a4b30331ac1f557d752eb8290633042144550a7
          path: openems
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply direction-aware candidate and regression tests
        shell: bash
        run: |
          for file in research/tests/*.java research/tests/candidate/*.java; do
            cp "$file" openems/io.openems.edge.ess.core/test/io/openems/edge/ess/core/power/v2/
          done
          git -C openems apply --check "$GITHUB_WORKSPACE/research/patches/candidate-direction-aware-rebalance.patch"
          git -C openems apply "$GITHUB_WORKSPACE/research/patches/candidate-direction-aware-rebalance.patch"
          git -C openems diff --check
          git -C openems diff --stat
      - name: Run full ESS Core native JUnit
        working-directory: openems
        run: |
          chmod +x gradlew
          ./gradlew :io.openems.edge.ess.core:test --no-daemon
      - name: Check native Java style
        working-directory: openems
        run: ./gradlew :io.openems.edge.ess.core:checkstyleMain :io.openems.edge.ess.core:checkstyleTest --no-daemon
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direction-aware-candidate-results
          path: |
            openems/io.openems.edge.ess.core/build/test-results/**
            openems/io.openems.edge.ess.core/build/reports/tests/**
          if-no-files-found: ignore
